[project]
name = "job-tracker"
version = "0.1.0"
description = "Track my job applications"
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.4",
    "pydantic[email]>=2.14.3",
    "sqlalchemy[asyncio]>=2.1.8",
]

[tool.fastapi]
entrypoint = "app.main:app"
